name: Build XigmaNAS Overlay
run-name: XigmaNAS overlay | ${{ inputs.mode || 'build' }} | slice ${{ inputs.slice || '1' }}

on:
  push:
    branches: [cache-overlay]
    paths-ignore:
      - .ci/README.md
      - .github/workflows/import.yml
      - .github/workflows/diagnostics.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare the cached environment, or build LiveCD and LiveUSB images
        type: choice
        options: [build, environment]
        default: build
      source_sha:
        description: Exact source commit for an automatic continuation (normally empty)
        type: string
        default: ''
      slice:
        description: Continuation number (normally leave at 1)
        type: string
        default: '1'

permissions:
  contents: write
  actions: write

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/cache-overlay' &&
      (inputs.source_sha == '' || inputs.source_sha == github.sha)
    concurrency:
      group: xigmanas-build-cache-overlay
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CI_MODE: ${{ inputs.mode || 'build' }}
      SLICE: ${{ inputs.slice || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate inputs and identify compatible environment
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SLICE" =~ ^[1-9][0-9]?$ ]] && (( SLICE <= 12 ))
          test -f .ci/svn-import.json
          test -f build/functions.inc
          test "$(jq -r .revision .ci/svn-import.json)" = 10566
          echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "short_sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          key="$(cat .ci/freebsd.env .ci/prepare.sh | sha256sum | cut -c1-16)"
          echo "cache_key=fb143-v1-$key" >> "$GITHUB_OUTPUT"
      - name: Verify durable checkpoint permission before expensive work
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .ci/checkpoint-overlay.sh preflight '${{ steps.meta.outputs.cache_key }}'
      - name: Reclaim runner disk for the FreeBSD build
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          test -c /dev/kvm
      - name: Start cached FreeBSD 14.3 toolchain
        id: vm
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b
        with:
          release: '14.3'
          arch: x86_64
          mem: 12288
          cpu: 4
          sync: rsync
          copyback: false
          cache-after-prepare: true
          cache-after-prepare-key-suffix: ${{ hashFiles('.ci/prepare.sh') }}
          prepare: sh .ci/prepare.sh
          run: |
            uname -a
            df -h
      - name: Recover an emergency checkpoint after a failed release upload
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xigmanas-overlay-checkpoint
          key: overlay-fallback-${{ steps.meta.outputs.cache_key }}-cache-overlay-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: overlay-fallback-${{ steps.meta.outputs.cache_key }}-cache-overlay-
      - name: Restore durable build checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .ci/checkpoint-overlay.sh restore '${{ steps.meta.outputs.cache_key }}'
      - name: Synchronize the exact Git checkout into the build tree
        shell: bash
        run: |
          ssh freebsd "/usr/local/bin/bash '$GITHUB_WORKSPACE/.ci/port-cache.sh' seed \
            /usr/local/xigmanas/svn /usr/local/xigmanas/state"
          ssh freebsd 'mkdir -p /usr/local/xigmanas/svn'
          rsync -a --chown=0:0 --delete --exclude='**/work/' --exclude='build/ports/xigmanas.mk' \
            ./ freebsd:/usr/local/xigmanas/svn/
          ssh freebsd "test \"\$(git -C /usr/local/xigmanas/svn rev-parse HEAD)\" = '$BUILD_SHA'"
      - name: Build or resume on the FreeBSD machine
        id: compile
        shell: bash
        run: |
          mkdir -p diagnostics artifacts
          set +e
          set -o pipefail
          ssh freebsd "env BUILD_SHA='$BUILD_SHA' CI_MODE='$CI_MODE' \
            timeout -k 60 12600 /usr/local/bin/bash /usr/local/xigmanas/svn/.ci/build.sh" \
            2>&1 | tee diagnostics/build.log
          rc="${PIPESTATUS[0]}"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Build exit code: $rc" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Collect completed images before checkpoint backup
        id: images
        if: success() && steps.compile.outputs.rc == '0' && env.CI_MODE == 'build'
        shell: bash
        run: |
          rsync -a freebsd:/usr/local/xigmanas/artifacts/ artifacts/
          test -n "$(find artifacts -name '*-LiveCD-*.iso' -print -quit)"
          test -n "$(find artifacts -name '*-LiveUSB-GPT-*.img.gz' -print -quit)"
      - name: Upload LiveCD before checkpoint backup
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        with:
          name: xigmanas-LiveCD-amd64-${{ steps.meta.outputs.short_sha }}
          path: artifacts/LiveCD/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload LiveUSB before checkpoint backup
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        with:
          name: xigmanas-LiveUSB-GPT-amd64-${{ steps.meta.outputs.short_sha }}
          path: artifacts/LiveUSB-GPT/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save expensive work, including partial builds
        id: checkpoint
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .ci/checkpoint-overlay.sh save '${{ steps.meta.outputs.cache_key }}' 2>&1 | tee diagnostics/checkpoint.log
      - name: Preserve the archive if the release service rejects an upload
        if: ${{ !cancelled() && steps.checkpoint.outcome == 'failure' && steps.checkpoint.outputs.archive_ready == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xigmanas-overlay-checkpoint
          key: overlay-fallback-${{ steps.meta.outputs.cache_key }}-cache-overlay-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Collect build diagnostics
        if: ${{ !cancelled() && steps.vm.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p diagnostics artifacts
          ssh freebsd 'uname -a; df -h; ccache --show-stats' > diagnostics/environment.txt
          rsync -a freebsd:/usr/local/xigmanas/state/ diagnostics/state/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Continue before the hosted runner time limit
        if: success() && steps.compile.outputs.rc == '124'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          repository="$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name)"
          latest="$(gh api "repos/$repository/git/ref/heads/cache-overlay" --jq .object.sha)"
          continuation_sha="$BUILD_SHA"
          if [[ "$latest" != "$BUILD_SHA" ]]; then
            ignored_only="$(gh api "repos/$repository/compare/$BUILD_SHA...$latest" \
              --jq 'all(.files[]; .filename == ".ci/README.md" or .filename == ".github/workflows/import.yml" or .filename == ".github/workflows/diagnostics.yml")')"
            if [[ "$ignored_only" != true ]]; then
              echo "Checkpoint saved. A newer source commit takes precedence over this continuation." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            continuation_sha="$latest"
          fi
          if (( SLICE >= 12 )); then
            echo "::error::Build exceeded 12 slices. Inspect diagnostics before continuing manually."
            exit 1
          fi
          gh workflow run build.yml --ref cache-overlay --repo "$repository" \
            -f mode="$CI_MODE" -f source_sha="$continuation_sha" -f slice="$((SLICE + 1))"
          echo "Checkpoint saved; continuation $((SLICE + 1)) dispatched." >> "$GITHUB_STEP_SUMMARY"
      - name: Report a genuine build failure
        if: ${{ !cancelled() && steps.compile.outputs.rc != '' && steps.compile.outputs.rc != '0' && steps.compile.outputs.rc != '124' }}
        run: |
          echo "::error::FreeBSD build failed with code ${{ steps.compile.outputs.rc }}. See diagnostics."
          exit 1
