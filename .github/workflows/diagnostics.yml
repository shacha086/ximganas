name: Read Build Failure

on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnostics.yml]
  workflow_dispatch:
    inputs:
      job_id:
        description: Completed Actions job whose final log section should be inspected
        type: string
        default: '130733497246'

permissions:
  contents: write
  actions: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify checkpoint upload permission before expensive compilation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name)"
          echo "Canonical repository: $repository"
          release_id="$(gh api --method POST "repos/$repository/releases" \
            -f tag_name="ci-cache-permission-probe-$GITHUB_RUN_ID" \
            -f target_commitish="$GITHUB_SHA" -F draft=true --jq .id)"
          gh api --method DELETE "repos/$repository/releases/$release_id"
          echo "Creating and deleting a draft checkpoint succeeded."
      - name: Read the final log section on the Actions machine
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id || '130733497246' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[0-9]+$ ]]
          repository="$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name)"
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$repository/actions/jobs/$JOB_ID/logs" > job.log
          { head -n 45 job.log; tail -n 140 job.log; } > feedback.log
          marker="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$marker"
          cat feedback.log
          echo "::$marker::"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-feedback-${{ github.run_id }}
          path: feedback.log
          if-no-files-found: warn
          retention-days: 7
