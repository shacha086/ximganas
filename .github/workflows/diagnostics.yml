name: Read Build Failure

on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnostics.yml]
  workflow_dispatch:
    inputs:
      job_id:
        description: Completed Actions job whose final log section should be inspected
        type: string
        default: '130793966906'

permissions:
  contents: write
  actions: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify checkpoint upload permission before expensive compilation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name)"
          echo "Canonical repository: $repository"
          branch="$(gh api "repos/$repository" --jq .default_branch)"
          if release_id="$(gh api --method POST "repos/$repository/releases" \
            -f tag_name="ci-cache-old-sha-probe-$GITHUB_RUN_ID" \
            -f target_commitish=9d5b09ad8a28e69db300c1dbcf66b449f020b1fd \
            -F draft=true --jq .id)"; then
            gh api --method DELETE "repos/$repository/releases/$release_id"
            echo "Old-SHA probe unexpectedly succeeded."
          else
            echo "Old-SHA checkpoint creation reproduced the permission failure."
          fi
          tag="ci-cache-permission-probe-$GITHUB_RUN_ID"
          trap 'gh release delete "$tag" --cleanup-tag --yes --repo "$repository" || true' EXIT
          printf 'checkpoint permission roundtrip\n' > probe.txt
          sha256sum probe.txt > SHA256SUMS
          gh release create "$tag" --repo "$repository" --target "$branch" \
            --draft --prerelease --latest=false --title 'Temporary CI permission probe' \
            probe.txt SHA256SUMS
          gh release edit "$tag" --repo "$repository" --target "$branch" --draft=false
          gh release download "$tag" --repo "$repository" --dir restored
          (cd restored && sha256sum -c SHA256SUMS)
          echo "Default-branch create/upload/publish/download/checksum succeeded."
      - name: Inspect all legacy process-group calls in Firefly on Actions
        shell: bash
        run: |
          for mirror in https://distfiles.macports.org/mt-daapd \
            https://ftp.momo-i.org/pub/other \
            https://src.fedoraproject.org/repo/pkgs/mt-daapd/mt-daapd-svn-1696.tar.gz/42ba1f432bb88e18a8cb4ce0fc52eb64; do
            if curl --fail --location --max-time 45 \
              "$mirror/mt-daapd-svn-1696.tar.gz" -o firefly.tar.gz; then
              break
            fi
          done
          echo '9c3f1fc4d46391286ec8572c3080bb28d681ea6b1afe3ba51ffadf2eb7cfa344  firefly.tar.gz' | sha256sum -c -
          tar -xzf firefly.tar.gz
          grep -Rn -E 'setpgrp[[:space:]]*\(' mt-daapd-svn-1696/src
      - name: Read the final log section on the Actions machine
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id || '130793966906' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[0-9]+$ ]]
          repository="$(gh api "repos/$GITHUB_REPOSITORY" --jq .full_name)"
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$repository/actions/jobs/$JOB_ID/logs" > job.log
          { head -n 45 job.log; tail -n 140 job.log; } > feedback.log
          marker="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$marker"
          cat feedback.log
          echo "::$marker::"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-feedback-${{ github.run_id }}
          path: feedback.log
          if-no-files-found: warn
          retention-days: 7
