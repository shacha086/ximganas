name: Cancel Queued Build

on:
  push:
    branches: [ci/build-maintenance]
    paths: [.github/workflows/maintenance.yml]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN: '43175909689'
    steps:
      - name: Cancel only the queued cache-optimization build
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN")"
          jq -e '.head_sha == "c6f37283370c5871d751e843e4bcf8013fa8a658" and .head_branch == "main"' <<< "$run"
          if [[ "$(jq -r .status <<< "$run")" != completed ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN/cancel"
          fi
          for attempt in {1..24}; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN")"
            if [[ "$(jq -r .status <<< "$run")" == completed ]]; then
              jq -e '.conclusion == "cancelled"' <<< "$run"
              echo "Cancelled queued build $TARGET_RUN." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Cancellation did not finish within two minutes."
          exit 1
